# Serves the mobile SPA on port 80 (published as 9700). Caching is off so updates show immediately.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;

    location ~ /(serve\.(py|sh)|nginx\.conf)$ {
        return 404;
    }
}
