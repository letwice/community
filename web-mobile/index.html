<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a37">
  <title>Community Store</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <a href="#/home" class="brand">Community Store</a>
    <div class="header-right">
      <span id="role-badge" class="role-badge" hidden></span>
      <button id="logout" class="link-button" hidden>Log out</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/home" data-tab="home"><span>🏠</span>Home</a>
    <a href="#/browse" data-tab="browse"><span>🛍</span>Browse</a>
    <a href="#/bulletin" data-tab="bulletin"><span>📋</span>Bulletin</a>
    <a href="#/manage" data-tab="manage" id="manage-tab" hidden><span id="manage-icon">🏪</span><em id="manage-label">Sell</em></a>
    <a href="#/admin" data-tab="admin" id="admin-tab" hidden><span>🛡</span>Admin</a>
    <a href="#/cart" data-tab="cart" id="cart-tab"><span>🛒</span>Cart<b id="cart-badge" class="badge" hidden></b></a>
    <a href="#/inbox" data-tab="inbox"><span>🔔</span>Inbox<b id="inbox-badge" class="badge" hidden></b></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
